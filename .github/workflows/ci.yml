name: CI — lint, testes unitários & E2E

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege (auditoria de segurança): o workflow inteiro só lê o
# repositório. O job e2e adiciona `actions: write` APENAS nele — necessário
# para o actions/upload-artifact@v4 subir o relatório do Playwright (o escopo
# `actions` no nível do workflow estaria em none e quebraria o upload).
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:run
      - run: npm run test:coverage

  e2e:
    name: E2E (Playwright — 4 projetos)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload-artifact@v4 (relatório do Playwright em falha)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browsers: Chrome, Firefox e WebKit (Safari) — RNF-07.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
